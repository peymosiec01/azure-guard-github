name: Azure Guard - daily cost
on:
  schedule:
    - cron: '0 8 * * *' # 08:00 UTC (09:00 UK during BST)
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_MONITOR_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Daily cost and Teams report
        shell: pwsh
        env:
          AZURE_GUARD_WEBHOOK: ${{ secrets.TEAMS_WORKFLOW_WEBHOOK }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          MONTHLY_BUDGET: ${{ vars.MONTHLY_BUDGET }}
        run: |
          $budget = if ($env:MONTHLY_BUDGET) { [decimal]::Parse($env:MONTHLY_BUDGET, [Globalization.CultureInfo]::InvariantCulture) } else { 0 }
          ./monitor.ps1 -SubscriptionId $env:SUBSCRIPTION_ID -MonthlyBudget $budget
